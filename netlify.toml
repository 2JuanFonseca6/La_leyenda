[build]
  command = "bun run build"
  publish = ".output" # ← ¡Este es el punto clave!

[build.environment]
  NODE_VERSION = "20"
  BUN_INSTALL = "/opt/buildhome/.bun"
  PATH = "/opt/buildhome/.bun/bin:$PATH"

# ⚠️ NO uses redirect a index.html en SSR, así que esto lo eliminamos:
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
